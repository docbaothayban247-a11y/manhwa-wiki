    <text x="24" y="40" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="800">100% Free</text>
    <text x="24" y="68" fill="#71717a" font-family="sans-serif" font-size="14" font-weight="600">Full Scans Access</text>
