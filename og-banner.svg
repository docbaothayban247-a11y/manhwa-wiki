  <text x="130" y="130" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="2">📚 CHARACTER CODEX 2026</text>
  
  <!-- Main Title -->
  <text x="100" y="220" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">MANHWA <tspan fill="url(#brandP)">WIKI</tspan></text>
  <text x="100" y="290" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500">Definitive Character Lore, Relationship Trees &amp; Reading Archives</text>
  
  <!-- Metrics Badges -->
  <g transform="translate(100, 360)">
    <rect width="200" height="90" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="24" y="40" fill="#c084fc" font-family="sans-serif" font-size="28" font-weight="800">1,880+</text>
    <text x="24" y="68" fill="#71717a" font-family="sans-serif" font-size="14" font-weight="600">Character Files</text>
  </g>
  
  <g transform="translate(330, 360)">
