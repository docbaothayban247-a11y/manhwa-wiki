    <text x="24" y="40" fill="#f59e0b" font-family="sans-serif" font-size="28" font-weight="800">Canon</text>
    <text x="24" y="68" fill="#71717a" font-family="sans-serif" font-size="14" font-weight="600">Storyline Guides</text>
  </g>
  
  <g transform="translate(580, 360)">
